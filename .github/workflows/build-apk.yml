name: Build Dictate APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Dictate v6.0.0
        uses: actions/checkout@v7
        with:
          repository: DevEmperor/DictateKeyboard
          ref: v6.0.0
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "ndk;29.0.14206865"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare build scripts
        run: |
          chmod +x gradlew
          chmod +x tools/fetch-sherpa-onnx.sh

      - name: Download sherpa-onnx libraries
        run: |
          ./tools/fetch-sherpa-onnx.sh

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Show generated APK
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -ls

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Dictate-6.0.0-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
